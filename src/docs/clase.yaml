/api/clases/{id}:
  get:
    summary: Obtener una clase por ID
    tags: [Clases]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la clase
    responses:
      200:
        description: Clase obtenida correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Clase obtenida correctamente
                data:
                  $ref: '#/components/schemas/Clase'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  put:
    summary: Actualizar una clase existente
    tags: [Clases]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la clase
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              fecha_clase:
                type: string
                format: date
                example: '2024-01-15'
                description: Fecha de la clase
              hora_inicio:
                type: string
                format: time
                example: '09:00:00'
                description: Hora de inicio de la clase (formato HH:MM o HH:MM:SS)
              hora_fin:
                type: string
                format: time
                example: '10:30:00'
                description: Hora de fin de la clase (formato HH:MM o HH:MM:SS)
              id_grupo:
                type: integer
                example: 1
                description: ID del grupo de la clase
              estado:
                type: string
                enum: [pendiente, realizada, suspendida]
                example: pendiente
                description: Estado de la clase (pendiente, realizada, suspendida)
    responses:
      200:
        description: Clase actualizada correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Clase actualizada correctamente
                data:
                  $ref: '#/components/schemas/Clase'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  delete:
    summary: Eliminar una clase
    tags: [Clases]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la clase
    responses:
      200:
        description: Clase eliminada correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Clase eliminada correctamente
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: Clase eliminada correctamente
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

