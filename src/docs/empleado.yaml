/api/empleados:
  get:
    summary: Obtener todos los empleados
    tags: [Empleados]
    responses:
      200:
        description: Lista de empleados obtenida correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Empleados obtenidos correctamente
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Empleado'
      500:
        $ref: '#/components/responses/InternalServerError'

  post:
    summary: Crear un nuevo empleado
    tags: [Empleados]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - tipo
              - usuario
              - contrasenia
              - nombre
              - apellido
              - telefono
              - fecha_alta
            properties:
              tipo:
                type: string
                maxLength: 20
                example: Administrador
                description: Tipo de empleado
              usuario:
                type: string
                maxLength: 50
                example: jperez
                description: Nombre de usuario único
              contrasenia:
                type: string
                example: password123
                description: Contraseña (se hasheará automáticamente)
              nombre:
                type: string
                maxLength: 50
                example: Juan
                description: Nombre del empleado
              apellido:
                type: string
                maxLength: 50
                example: Pérez
                description: Apellido del empleado
              dni:
                type: string
                minLength: 8
                maxLength: 8
                example: "12345678"
                description: DNI del empleado (8 caracteres)
              telefono:
                type: string
                minLength: 10
                maxLength: 10
                example: "1234567890"
                description: Teléfono del empleado (10 caracteres)
              fecha_alta:
                type: string
                format: date
                example: "2024-01-15"
                description: Fecha de alta del empleado
              estado:
                type: integer
                minimum: 0
                maximum: 1
                example: 1
                description: Estado del empleado (1 activo, 0 inactivo)
    responses:
      201:
        description: Empleado creado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Empleado creado correctamente
                data:
                  $ref: '#/components/schemas/Empleado'
      400:
        $ref: '#/components/responses/BadRequest'
      409:
        $ref: '#/components/responses/Conflict'
      500:
        $ref: '#/components/responses/InternalServerError'

/api/empleados/{id}:
  get:
    summary: Obtener un empleado por ID
    tags: [Empleados]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del empleado
    responses:
      200:
        description: Empleado obtenido correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Empleado obtenido correctamente
                data:
                  $ref: '#/components/schemas/Empleado'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  put:
    summary: Actualizar un empleado existente
    tags: [Empleados]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del empleado
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              tipo:
                type: string
                maxLength: 20
                example: Instructor
                description: Tipo de empleado
              usuario:
                type: string
                maxLength: 50
                example: jperez
                description: Nombre de usuario único
              contrasenia:
                type: string
                example: newpassword123
                description: Nueva contraseña (se hasheará automáticamente)
              nombre:
                type: string
                maxLength: 50
                example: Juan
                description: Nombre del empleado
              apellido:
                type: string
                maxLength: 50
                example: Pérez
                description: Apellido del empleado
              dni:
                type: string
                minLength: 8
                maxLength: 8
                example: "12345678"
                description: DNI del empleado (8 caracteres)
              telefono:
                type: string
                minLength: 10
                maxLength: 10
                example: "1234567890"
                description: Teléfono del empleado (10 caracteres)
              fecha_alta:
                type: string
                format: date
                example: "2024-01-15"
                description: Fecha de alta del empleado
              estado:
                type: integer
                minimum: 0
                maximum: 1
                example: 1
                description: Estado del empleado (1 activo, 0 inactivo)
    responses:
      200:
        description: Empleado actualizado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Empleado actualizado correctamente
                data:
                  $ref: '#/components/schemas/Empleado'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'
      409:
        $ref: '#/components/responses/Conflict'
      500:
        $ref: '#/components/responses/InternalServerError'

  delete:
    summary: Eliminar un empleado
    tags: [Empleados]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del empleado
    responses:
      200:
        description: Empleado eliminado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Empleado eliminado correctamente
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: Empleado eliminado correctamente
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

