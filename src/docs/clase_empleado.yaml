/api/clase-empleados/{idClase}/{idEmpleado}:
  get:
    summary: Obtener una relación clase-empleado por IDs
    tags: [Clase-Empleados]
    parameters:
      - in: path
        name: idClase
        required: true
        schema:
          type: integer
        description: ID de la clase
      - in: path
        name: idEmpleado
        required: true
        schema:
          type: integer
        description: ID del empleado
    responses:
      200:
        description: Relación clase-empleado obtenida correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Relación clase-empleado obtenida correctamente
                data:
                  $ref: '#/components/schemas/ClaseEmpleado'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  put:
    summary: Actualizar una relación clase-empleado existente
    tags: [Clase-Empleados]
    parameters:
      - in: path
        name: idClase
        required: true
        schema:
          type: integer
        description: ID de la clase
      - in: path
        name: idEmpleado
        required: true
        schema:
          type: integer
        description: ID del empleado
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              presente:
                type: integer
                minimum: 0
                maximum: 1
                example: 1
                description: Estado de presencia (1 presente, 0 ausente)
              rol:
                type: string
                maxLength: 20
                example: 'Asistente'
                description: Rol del empleado en la clase
    responses:
      200:
        description: Relación clase-empleado actualizada correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Relación clase-empleado actualizada correctamente
                data:
                  $ref: '#/components/schemas/ClaseEmpleado'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  delete:
    summary: Eliminar una relación clase-empleado
    tags: [Clase-Empleados]
    parameters:
      - in: path
        name: idClase
        required: true
        schema:
          type: integer
        description: ID de la clase
      - in: path
        name: idEmpleado
        required: true
        schema:
          type: integer
        description: ID del empleado
    responses:
      200:
        description: Relación clase-empleado eliminada correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Relación clase-empleado eliminada correctamente
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: Relación clase-empleado eliminada correctamente
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

