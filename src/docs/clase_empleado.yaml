/api/clase-empleados:
  get:
    summary: Obtener todas las relaciones clase-empleado
    tags: [Clase-Empleados]
    responses:
      200:
        description: Lista de relaciones clase-empleado obtenida correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Relaciones clase-empleado obtenidas correctamente
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ClaseEmpleado'
      500:
        $ref: '#/components/responses/InternalServerError'

  post:
    summary: Crear una nueva relación clase-empleado
    tags: [Clase-Empleados]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - id_clase
              - id_empleado
              - rol
            properties:
              id_clase:
                type: integer
                example: 1
                description: ID de la clase
              id_empleado:
                type: integer
                example: 1
                description: ID del empleado
              presente:
                type: integer
                minimum: 0
                maximum: 1
                example: 0
                description: Estado de presencia (1 presente, 0 ausente)
              rol:
                type: string
                maxLength: 20
                example: 'Instructor'
                description: Rol del empleado en la clase
    responses:
      201:
        description: Relación clase-empleado creada correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Relación clase-empleado creada correctamente
                data:
                  $ref: '#/components/schemas/ClaseEmpleado'
      400:
        $ref: '#/components/responses/BadRequest'
      500:
        $ref: '#/components/responses/InternalServerError'

