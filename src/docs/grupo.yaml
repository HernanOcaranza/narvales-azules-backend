/api/grupos:
  get:
    summary: Obtener todos los grupos
    tags: [Grupos]
    responses:
      200:
        description: Lista de grupos obtenida correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Grupos obtenidos correctamente
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Grupo'
      500:
        $ref: '#/components/responses/InternalServerError'

  post:
    summary: Crear un nuevo grupo
    tags: [Grupos]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - nombre
              - cupo_maximo
              - id_disciplina
              - id_categoria
            properties:
              nombre:
                type: string
                maxLength: 40
                example: Grupo A - Natación Infantil
                description: Nombre del grupo
              cupo_maximo:
                type: integer
                minimum: 1
                example: 20
                description: Cupo máximo de alumnos
              estado:
                type: integer
                minimum: 0
                maximum: 1
                example: 1
                description: Estado del grupo (1 activo, 0 inactivo)
              id_disciplina:
                type: integer
                example: 1
                description: ID de la disciplina
              id_categoria:
                type: integer
                example: 1
                description: ID de la categoría
              horarios:
                type: array
                description: Array opcional de horarios del grupo. Si se proporciona, se crearán automáticamente las clases del mes actual.
                items:
                  type: object
                  required:
                    - dia_semana
                    - hora_inicio
                    - hora_fin
                  properties:
                    dia_semana:
                      type: integer
                      minimum: 0
                      maximum: 6
                      example: 1
                      description: Día de la semana (0=Domingo, 1=Lunes, 2=Martes, 3=Miércoles, 4=Jueves, 5=Viernes, 6=Sábado)
                    hora_inicio:
                      type: string
                      format: time
                      example: "10:00:00"
                      description: Hora de inicio de la clase (formato HH:MM:SS)
                    hora_fin:
                      type: string
                      format: time
                      example: "11:00:00"
                      description: Hora de fin de la clase (formato HH:MM:SS)
                    activo:
                      type: integer
                      minimum: 0
                      maximum: 1
                      example: 1
                      description: Estado del horario (1 activo, 0 inactivo). Por defecto 1.
                example:
                  - dia_semana: 1
                    hora_inicio: "10:00:00"
                    hora_fin: "11:00:00"
                    activo: 1
                  - dia_semana: 3
                    hora_inicio: "10:00:00"
                    hora_fin: "11:00:00"
                    activo: 1
                  - dia_semana: 5
                    hora_inicio: "10:00:00"
                    hora_fin: "11:00:00"
                    activo: 1
    responses:
      201:
        description: Grupo creado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Grupo creado correctamente
                data:
                  $ref: '#/components/schemas/Grupo'
      400:
        $ref: '#/components/responses/BadRequest'
      409:
        $ref: '#/components/responses/Conflict'
      500:
        $ref: '#/components/responses/InternalServerError'

/api/grupos/{id}:
  get:
    summary: Obtener un grupo por ID
    tags: [Grupos]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del grupo
    responses:
      200:
        description: Grupo obtenido correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Grupo obtenido correctamente
                data:
                  $ref: '#/components/schemas/Grupo'
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

  put:
    summary: Actualizar un grupo existente
    tags: [Grupos]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del grupo
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              nombre:
                type: string
                maxLength: 40
                example: Grupo B - Natación Juvenil
                description: Nombre del grupo
              cupo_maximo:
                type: integer
                minimum: 1
                example: 25
                description: Cupo máximo de alumnos
              estado:
                type: integer
                minimum: 0
                maximum: 1
                example: 1
                description: Estado del grupo (1 activo, 0 inactivo)
              id_disciplina:
                type: integer
                example: 1
                description: ID de la disciplina
              id_categoria:
                type: integer
                example: 2
                description: ID de la categoría
    responses:
      200:
        description: Grupo actualizado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Grupo actualizado correctamente
                data:
                  $ref: '#/components/schemas/Grupo'
      400:
        $ref: '#/components/responses/BadRequest'
      404:
        $ref: '#/components/responses/NotFound'
      409:
        $ref: '#/components/responses/Conflict'
      500:
        $ref: '#/components/responses/InternalServerError'

  delete:
    summary: Eliminar un grupo
    tags: [Grupos]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID del grupo
    responses:
      200:
        description: Grupo eliminado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Grupo eliminado correctamente
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: Grupo eliminado correctamente
      404:
        $ref: '#/components/responses/NotFound'
      500:
        $ref: '#/components/responses/InternalServerError'

